<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Penguin Studio</title>
<style>
/* Penguin Studio. System type, one accent (penguin orange), one radius system:
   surfaces 22px, controls full pill, fields 14px. Springs for anything you can touch. */
:root {
  --bg: #f2f2f4; --surface: #ffffff; --raised: #ffffff; --fill: rgba(118,118,128,.12); --fill2: rgba(118,118,128,.08);
  --ink: #1d1d1f; --ink2: #6e6e73; --ink3: #a1a1a6; --sep: rgba(60,60,67,.14);
  --accent: #f2570f; --accent-ink: #ffffff; --accent-soft: rgba(242,87,15,.12);
  --good: #1f9d55; --bad: #d92d20;
  --chrome: rgba(250,250,252,.72); --shadow: 0 1px 2px rgba(29,29,31,.06), 0 12px 32px rgba(29,29,31,.08);
  --card-shadow: 0 2px 6px rgba(29,29,31,.06), 0 24px 60px rgba(29,29,31,.14);
  --r: 22px; --r-field: 14px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --tabh: 64px; --safe-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0c0e; --surface: #1c1c1e; --raised: #242426; --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.16);
    --ink: #f5f5f7; --ink2: #a1a1a6; --ink3: #6e6e73; --sep: rgba(84,84,88,.6);
    --accent: #ff6a24; --accent-soft: rgba(255,106,36,.16); --chrome: rgba(22,22,24,.72);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35); --card-shadow: 0 2px 6px rgba(0,0,0,.4), 0 24px 60px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--ink); }
a { color: var(--accent); text-decoration: none; }
svg { width: 1em; height: 1em; fill: currentColor; display: block; }
.muted { color: var(--ink2); }
:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; border-radius: 10px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 1fr; min-height: 100dvh; }
.side { display: none; }
main { padding: 0 18px calc(var(--tabh) + var(--safe-b) + 24px); max-width: 760px; width: 100%; margin: 0 auto; }
.head { display: flex; align-items: flex-end; gap: 12px; padding: 20px 2px 14px; }
.head h1 { margin: 0; font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -0.025em; }
.head .sub { font-size: 14px; color: var(--ink2); margin-top: 4px; }
.head .tools { margin-left: auto; display: flex; gap: 8px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: space-around; padding: 6px 8px calc(6px + var(--safe-b));
  background: var(--chrome); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border-top: 1px solid var(--sep); }
.tabbar button { flex: 1; display: grid; justify-items: center; gap: 2px; padding: 6px 0 4px; font-size: 10.5px; font-weight: 600; color: var(--ink3); letter-spacing: .01em; position: relative; }
.tabbar button svg { font-size: 25px; }
.tabbar button[aria-selected="true"] { color: var(--accent); }
.badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
@media (min-width: 960px) {
  .app { grid-template-columns: 248px 1fr; }
  .tabbar { display: none; }
  .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100dvh; padding: 28px 14px; border-right: 1px solid var(--sep); background: var(--chrome); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
  .side .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.01em; padding: 0 10px 18px; }
  .side .brand svg { color: var(--accent); font-size: 26px; }
  .side button { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-weight: 600; font-size: 15px; color: var(--ink2); text-align: left; position: relative; }
  .side button svg { font-size: 20px; }
  .side button[aria-selected="true"] { background: var(--fill); color: var(--ink); }
  .side button[aria-selected="true"] svg { color: var(--accent); }
  .side .badge { position: static; margin-left: auto; }
  .side .foot { margin-top: auto; font-size: 12.5px; color: var(--ink2); padding: 0 10px; line-height: 1.5; }
  main { padding: 0 40px 60px; max-width: 880px; }
  .head h1 { font-size: 40px; }
}

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 650; font-size: 15px; background: var(--fill); color: var(--ink); white-space: nowrap; transition: transform .12s ease, background .2s ease, opacity .2s ease; }
.btn:active { transform: scale(.97); }
.btn svg { font-size: 18px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ink { background: var(--ink); color: var(--bg); }
.btn.sm { height: 34px; padding: 0 14px; font-size: 14px; }
.btn.icon { width: 44px; padding: 0; }
.btn.sm.icon { width: 34px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; pointer-events: none; }
.seg { display: inline-flex; padding: 3px; background: var(--fill); border-radius: 999px; gap: 2px; }
.seg button { height: 32px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--ink2); transition: background .2s ease, color .2s ease; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--fill2); color: var(--ink2); font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.chip svg { font-size: 13px; }
.chip.hot { background: var(--accent-soft); color: var(--accent); }
.field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.field input, .field textarea, .field select { width: 100%; border: 1px solid transparent; background: var(--fill2); border-radius: var(--r-field); padding: 12px 14px; font-size: 16px; font-weight: 450; color: var(--ink); outline: none; transition: border-color .2s ease, background .2s ease; }
.field textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); background: var(--surface); }
.group { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.section { margin-top: 26px; }
.section > h2 { font-size: 20px; font-weight: 750; letter-spacing: -.012em; margin: 0 2px 12px; }
.empty { text-align: center; padding: 48px 24px; color: var(--ink2); }
.empty h3 { color: var(--ink); margin: 14px 0 6px; font-size: 20px; font-weight: 750; letter-spacing: -.01em; }
.empty .art { width: 56px; height: 56px; margin: 0 auto; border-radius: 18px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 28px; }
.empty .row { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.skel { background: linear-gradient(90deg, var(--fill2) 0, var(--fill) 50%, var(--fill2) 100%); background-size: 200% 100%; animation: skel 1.3s linear infinite; border-radius: 12px; }
@keyframes skel { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- Discover (card stack) ---------- */
.deck-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.deck-top .left { margin-left: auto; font-size: 13px; color: var(--ink2); font-weight: 600; }
.stage { position: relative; height: clamp(380px, calc(100dvh - 318px - var(--safe-b)), 600px); touch-action: none; user-select: none; -webkit-user-select: none; }
.discover-wrap { max-width: 480px; margin: 0 auto; }
.card { position: absolute; inset: 0; background: var(--raised); border-radius: 28px; box-shadow: var(--card-shadow); padding: 22px 22px 20px; display: flex; flex-direction: column; overflow: hidden; will-change: transform; transform-origin: 50% 85%; }
.card .tint { position: absolute; inset: 0 0 auto 0; height: 46%; background: radial-gradient(120% 90% at 0% 0%, var(--accent-soft), transparent 70%); pointer-events: none; }
.card.ever .tint { background: radial-gradient(120% 90% at 0% 0%, var(--fill), transparent 70%); }
.card .top { position: relative; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.card .opp { margin-left: auto; text-align: right; line-height: 1; }
.card .opp b { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
.card .opp span { font-size: 11px; font-weight: 700; color: var(--ink2); letter-spacing: .02em; }
.card .q { position: relative; font-size: clamp(25px, 6.4vw, 32px); line-height: 1.12; font-weight: 800; letter-spacing: -.022em; margin: 26px 0 12px; }
.card .hook { position: relative; font-size: 17px; color: var(--ink2); line-height: 1.4; }
.card .spacer { flex: 1; }
.card .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
.card .mini div { background: var(--fill2); border-radius: 16px; padding: 10px 12px; }
.card .mini b { display: block; font-size: 19px; font-weight: 750; letter-spacing: -.02em; }
.card .mini span { font-size: 11.5px; font-weight: 650; color: var(--ink2); }
.card .ev { margin-top: 12px; display: grid; gap: 6px; font-size: 13.5px; color: var(--ink2); }
.card .ev div { display: flex; gap: 10px; }
.card .ev b { margin-left: auto; color: var(--ink); font-weight: 700; white-space: nowrap; }
.card .ev a { color: var(--ink2); text-decoration: underline; text-decoration-color: var(--sep); }
.card .back { position: absolute; inset: 0; padding: 22px; background: var(--raised); overflow: auto; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.card.flipped .back { opacity: 1; pointer-events: auto; }
.card .back h3 { margin: 6px 0 10px; font-size: 22px; line-height: 1.2; letter-spacing: -.015em; }
.card .back p { margin: 0 0 12px; color: var(--ink2); font-size: 15.5px; }
.card .back p b { color: var(--ink); }
.card .flip { position: relative; align-self: flex-start; margin-top: 14px; font-size: 14px; font-weight: 650; color: var(--accent); display: inline-flex; align-items: center; gap: 4px; }
.stamp { position: absolute; top: 34px; padding: 6px 14px; border: 3px solid currentColor; border-radius: 12px; font-weight: 850; font-size: 26px; letter-spacing: .06em; opacity: 0; pointer-events: none; z-index: 3; }
.stamp.like { left: 22px; color: var(--accent); transform: rotate(-12deg); }
.stamp.pass { right: 22px; color: var(--ink2); transform: rotate(12deg); }
.stamp.later { left: 50%; top: auto; bottom: 120px; color: var(--ink); transform: translateX(-50%); }
.actions { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 18px; }
.round { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); font-size: 27px; transition: transform .15s ease; }
.round:active { transform: scale(.9); }
.round.sm { width: 48px; height: 48px; font-size: 20px; color: var(--ink2); }
.round.like { color: var(--accent); }
.round.pass { color: var(--ink2); }
.round.later { color: var(--ink); }
.hint { display: none; text-align: center; font-size: 12.5px; color: var(--ink3); margin-top: 12px; }
@media (hover: hover) and (pointer: fine) { .hint { display: block; } }

/* ---------- Ideas ---------- */
.list { display: grid; gap: 10px; }
.row-item { display: flex; align-items: center; gap: 14px; padding: 16px 18px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); text-align: left; width: 100%; transition: transform .12s ease; }
.row-item:active { transform: scale(.985); }
.row-item .t { font-weight: 700; font-size: 16.5px; line-height: 1.3; letter-spacing: -.008em; }
.row-item .m { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.row-item .go { margin-left: auto; color: var(--ink3); font-size: 16px; flex: none; }
.add { display: flex; gap: 10px; margin-bottom: 14px; }
.add input { flex: 1; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 0 18px; height: 48px; font-size: 16px; outline: none; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.32); opacity: 0; transition: opacity .3s ease; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 92dvh; background: var(--bg); border-radius: 26px 26px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.18); display: flex; flex-direction: column; transform: translateY(100%); will-change: transform; }
.sheet .grab { padding: 8px 0 2px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.sheet .grab i { width: 38px; height: 5px; border-radius: 3px; background: var(--ink3); opacity: .5; }
.sheet .bar { display: flex; align-items: center; gap: 10px; padding: 6px 18px 12px; touch-action: none; }
.sheet .bar h2 { margin: 0; font-size: 19px; font-weight: 750; letter-spacing: -.01em; flex: 1; line-height: 1.25; }
.sheet .body { overflow: auto; padding: 0 18px calc(24px + var(--safe-b)); display: grid; gap: 16px; overscroll-behavior: contain; }
@media (min-width: 960px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: 680px; max-height: 86dvh; border-radius: 26px; transform: translate(-50%, -46%) scale(.96); opacity: 0; }
  .sheet .grab { display: none; }
  .sheet .bar { padding-top: 18px; }
}
.pick { display: flex; gap: 8px; flex-wrap: wrap; }
.pick button { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--fill2); font-size: 14px; font-weight: 600; color: var(--ink2); }
.pick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.beats { display: grid; gap: 8px; }
.beat { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface); border-radius: 16px; padding: 12px 14px; font-size: 15px; }
.beat .n { font-weight: 750; color: var(--ink3); font-size: 13px; padding-top: 2px; }
.beat .v { color: var(--ink2); font-size: 13.5px; margin-top: 4px; }
.note { background: var(--surface); border-radius: 14px; padding: 10px 14px; font-size: 14.5px; }
.note time { display: block; color: var(--ink3); font-size: 12px; font-weight: 600; }
.notice { background: var(--surface); border-radius: 16px; padding: 14px 16px; font-size: 14.5px; color: var(--ink2); }
.notice b { color: var(--ink); }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btnrow .grow { flex: 1; }

/* ---------- Studio ---------- */
.prod { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.prod + .prod { margin-top: 14px; }
.prod .media { position: relative; background: #000; height: min(62dvh, 600px); display: grid; place-items: center; overflow: hidden; }
.prod .media.empty-m { height: 132px; background: radial-gradient(120% 140% at 0% 0%, var(--accent-soft), transparent 70%), var(--fill2); }
.prod .media.empty-m .ph { color: var(--ink2); }
.prod .media img, .prod .media video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
.prod .media .ph { color: rgba(255,255,255,.55); display: grid; justify-items: center; gap: 10px; font-size: 14px; font-weight: 600; text-align: center; padding: 20px; }
.prod .media .ph svg { font-size: 34px; }
.prod .media .playbtn { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 56px; background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,.35)); }
.prod .media .playbtn span { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.22); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.prod .media .playbtn svg { font-size: 30px; margin-left: 4px; }
.prod .info { padding: 16px 18px 18px; display: grid; gap: 12px; }
.prod .t { font-size: 18px; font-weight: 750; letter-spacing: -.012em; line-height: 1.25; }
.prod .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.track { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 3px; background: var(--accent); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.track.live i { background-image: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); background-size: 140px 100%; background-repeat: no-repeat; animation: shim 1.3s linear infinite; background-color: var(--accent); }
@keyframes shim { from { background-position: -140px 0; } to { background-position: 420px 0; } }
.stepline { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink2); gap: 10px; }
.steps { display: flex; gap: 4px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--fill); }
.steps i.done { background: var(--ink); }
.steps i.now { background: var(--accent); }
.steps-l { display: flex; justify-content: space-between; font-size: 10.5px; font-weight: 650; color: var(--ink3); letter-spacing: .01em; }
.err { color: var(--bad); font-size: 13.5px; font-weight: 600; }
.pubs { display: grid; gap: 8px; }
.pub { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--fill2); font-size: 14px; }
.pub svg { font-size: 20px; }
.pub .s { color: var(--ink2); font-size: 12.5px; }
.pub .btn { margin-left: auto; }

/* ---------- Stats ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.tile { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 18px; }
.tile .n { font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.tile .l { font-size: 13px; color: var(--ink2); font-weight: 600; margin-top: 4px; }
.tile.wide { grid-column: 1 / -1; }
.meter { height: 10px; border-radius: 5px; background: var(--fill); overflow: hidden; margin-top: 12px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.guide { counter-reset: s; display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.guide li { counter-increment: s; position: relative; padding: 14px 16px 14px 52px; background: var(--surface); border-radius: 16px; font-size: 15px; line-height: 1.45; }
.guide li::before { content: counter(s); position: absolute; left: 14px; top: 13px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 13px; }
.guide code { background: var(--fill2); padding: 2px 6px; border-radius: 6px; font-size: 13.5px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + var(--safe-b) + 18px); z-index: 60; transform: translate(-50%, 20px); opacity: 0; padding: 12px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14.5px; font-weight: 600; box-shadow: var(--shadow); transition: transform .35s cubic-bezier(.2,.9,.3,1.2), opacity .25s ease; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; }
.toast.on { transform: translate(-50%, 0); opacity: 1; }
@media (min-width: 960px) { .toast { bottom: 28px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}
@media (prefers-reduced-transparency: reduce) {
  .tabbar, .side { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Sections">
    <div class="brand"><span data-i="penguin"></span>Penguin Studio</div>
    <button data-view="discover" aria-selected="true"><span data-i="discover"></span>Discover</button>
    <button data-view="ideas" aria-selected="false"><span data-i="ideas"></span>Ideas<span class="badge" data-badge="ideas" hidden></span></button>
    <button data-view="studio" aria-selected="false"><span data-i="studio"></span>Studio<span class="badge" data-badge="studio" hidden></span></button>
    <button data-view="stats" aria-selected="false"><span data-i="stats"></span>Channel</button>
    <div class="foot" id="engineFoot">Connecting…</div>
  </aside>

  <main>
    <!-- Discover -->
    <section class="view" id="view-discover">
      <div class="head"><div><h1>Discover</h1><div class="sub" id="deckSub">Swipe right to keep an idea</div></div>
        <div class="tools"><button class="btn sm icon" id="btnRefresh" aria-label="Refresh deck"><span data-i="refresh"></span></button></div></div>
      <div class="discover-wrap">
      <div class="deck-top">
        <div class="seg" id="modeSeg" role="group" aria-label="Deck order">
          <button data-mode="mix" aria-pressed="true">For you</button><button data-mode="hot" aria-pressed="false">Hot</button><button data-mode="ever" aria-pressed="false">Evergreen</button><button data-mode="odds" aria-pressed="false">Best odds</button>
        </div>
      </div>
      <div class="stage" id="stack" aria-live="polite"></div>
      <div class="actions">
        <button class="round sm" id="btnUndo" aria-label="Undo last swipe"><span data-i="undo"></span></button>
        <button class="round pass" id="btnPass" aria-label="Pass"><span data-i="x"></span></button>
        <button class="round later" id="btnLater" aria-label="Save for later"><span data-i="later"></span></button>
        <button class="round like" id="btnLike" aria-label="Keep idea"><span data-i="heart"></span></button>

function renderDeck() {

function setupCard(el, next, third) {
  const stamps = { like: $(".stamp.like", el), pass: $(".stamp.pass", el), later: $(".stamp.later", el) };
  $$("[data-flip]", el).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); el.classList.toggle("flipped"); }));
  let x = 0, y = 0, down = false, sx = 0, sy = 0, hist = [], fromTop = true, cancel = [], moved = false;
  const W = () => el.offsetWidth;

    const rot = RM ? 0 : (x / W()) * 16 * (fromTop ? 1 : -1);
    el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
    const p = Math.min(1, Math.hypot(x, y) / (W() * 0.4));
    if (next) next.style.transform = `translateY(${12 - 12 * p}px) scale(${0.955 + 0.045 * p})`;
    if (third) third.style.transform = `translateY(${24 - 12 * p}px) scale(${0.91 + 0.045 * p})`;

}

async function decide(dir) {

  setTimeout(() => { if (b.isConnected && !b.disabled) { delete b.dataset.armed; b.innerHTML = was; } }, 3000);
  return false;
}
function openNotes(j) {
  openSheet("Notes and redo", `
    <label class="field">What should change?<textarea data-notes placeholder="Try a noir look. More penguin. Slower narration. The cut at 0:20 is too fast."></textarea></label>
    <div class="btnrow">
      <button class="btn grow" data-redo="scenes">${ic("refresh")}New look and shots</button>
      <button class="btn grow" data-redo="voice">${ic("mic")}New voice take</button>
    </div>
    <div class="notice"><b>New look and shots</b> keeps the voice and redraws everything else. <b>New voice take</b> keeps every frame and clip, so it costs cents.</div>`, (root) => {
    $$("[data-redo]", root).forEach((b) => (b.onclick = async () => {
      const notes = $("[data-notes]", root).value.trim(); if (!notes) return toast("Add a note so the redo knows what to change.");
      b.disabled = true;
      try { await inbox("redo", { id: j.id, stage: b.dataset.redo, notes }); toast("Redo queued."); closeSheet(); } catch (e) { toast(mcpErr(e)); b.disabled = false; }
    }));
  });
}

/* ---------- Channel ---------- */
function renderStats() {
  const st = S.files["status.json"] || {}; const b = st.budget || {}; const all = jobs();
  const shorts = all.filter((j) => j.v === 3 && j.cost); const avg = shorts.length ? shorts.reduce((a, j) => a + Number(j.cost || 0), 0) / shorts.length : null;
  const used = Number(b.total || 0), cap = Number(b.cap || 280), left = Math.max(0, cap - used);
  const ends = b.window_ends ? new Date(b.window_ends).toLocaleDateString(undefined, { day: "numeric", month: "long" }) : "";
  const igOn = !!(st.instagram && st.instagram.connected);
  $("#statsBody").innerHTML = `
    <div class="tiles">
      <div class="tile wide"><div class="n">$${left.toFixed(0)} left</div><div class="l">of $${cap} in Google credits${ends ? ", until " + ends : ""}</div><div class="meter"><i style="width:${Math.min(100, (used / cap) * 100).toFixed(1)}%"></i></div>
        <div class="l" style="margin-top:10px">${avg ? `A Short costs about $${avg.toFixed(2)}, so that's roughly ${Math.floor(left / avg)} more.` : "Cost per Short shows after the first one."}</div></div>
      <div class="tile"><div class="n">${all.filter((j) => j.stage === "scheduled" || j.stage === "live").length}</div><div class="l">Shorts on YouTube</div></div>
      <div class="tile"><div class="n">${all.filter((j) => WORKING.has(j.stage)).length}</div><div class="l">In production</div></div>
    </div>
    <div class="section"><h2>Narration</h2>
      <div class="pick" id="vsPick">${VSTYLES.map(([k, l]) => `<button data-v="${k}" aria-pressed="${(S.vstyle || "C") === k}">${l}</button>`).join("")}</div>
      <p class="muted" style="font-size:14px;margin:10px 2px 0">Default delivery for new Shorts. Each idea can override it.</p></div>
    <div class="section"><h2>Instagram</h2>
      ${igOn ? `<div class="notice"><b>Connected${st.instagram.username ? " as @" + esc(st.instagram.username) : ""}.</b> Post any finished Short from the Studio. Nothing goes to Instagram unless you tap Post.</div>` : `<div class="notice"><b>Not connected yet.</b> About 10 minutes, once. Reels post to the account you link, and only when you tap Post on a Short.${st.instagram && st.instagram.error ? `<br><span class="err">${esc(st.instagram.error)}</span>` : ""}</div>
      <ol class="guide" style="margin-top:12px">
        <li>In the Instagram app: <b>Settings, Account type and tools, Switch to professional account</b>. Pick <b>Creator</b>.</li>
        <li>On Facebook, create a Page for Curious Penguin. In the Page: <b>Settings, Linked accounts, Instagram, Connect</b>, and sign in to the Instagram account.</li>
        <li>Go to <b>developers.facebook.com</b>, My Apps, <b>Create app</b>. Use case <b>Other</b>, type <b>Business</b>. In the app, add the <b>Instagram</b> product and pick <b>API setup with Facebook login</b>.</li>
        <li>Open <b>Tools, Graph API Explorer</b>. Pick your app, then add these permissions: <code>instagram_basic</code>, <code>instagram_content_publish</code>, <code>pages_show_list</code>, <code>pages_read_engagement</code>, <code>business_management</code>. Tap <b>Generate Access Token</b> and allow your Page and Instagram account.</li>
        <li>Open <b>Tools, Access Token Debugger</b>, paste that token, tap <b>Extend Access Token</b> and copy the long one.</li>
        <li>Back in Graph API Explorer, paste the long token and run <code>me/accounts?fields=name,access_token,instagram_business_account</code>. From your Page's row, copy <b>access_token</b> (this one never expires) and the <b>instagram_business_account id</b>.</li>
        <li>In GitHub, repo <b>Settings, Secrets and variables, Actions</b>: add <code>IG_ACCESS_TOKEN</code> (the Page token) and <code>IG_USER_ID</code> (the id). Tell me when it's in and I'll run a test post.</li>
      </ol>`}
    </div>
    <div class="section"><h2>YouTube</h2><div class="notice">Approved Shorts upload as <b>private</b> with title, description, tags and the AI disclosure, then show a suggested publish time. You publish from YouTube Studio until Google approves the API audit.</div></div>`;
  $$("#vsPick button").forEach((btn) => (btn.onclick = async () => { S.vstyle = btn.dataset.v; $$("#vsPick button").forEach((x) => x.setAttribute("aria-pressed", String(x === btn))); if (S.db) { try { await S.db.doc("settings/voice").set({ name: S.voice || null, style: S.vstyle }); } catch (e) {} } toast("Saved"); }));
}

function badges() {
  const n1 = [...S.ideas.values()].filter((i) => ideaStatus(i) === "active").length;
  const n2 = jobs().filter((j) => j.stage === "final_ready").length;
  $$('[data-badge="ideas"]').forEach((b) => { b.textContent = n1; b.hidden = !n1; });
  $$('[data-badge="studio"]').forEach((b) => { b.textContent = n2; b.hidden = !n2; });
}

/* ---------- boot ---------- */
paintIcons(); renderDeck();
$("#stack").innerHTML = `<div class="card" style="box-shadow:var(--card-shadow)"><div class="skel" style="height:26px;width:40%"></div><div class="skel" style="height:96px;margin-top:30px"></div><div class="skel" style="height:22px;width:70%;margin-top:14px"></div></div>`;
(async () => {
  const [db, mcp, sample] = await Promise.all([claude.use("db").catch(() => null), claude.use("mcp").catch(() => null), claude.use("sample").catch(() => null)]);
  S.db = db; S.mcp = mcp; S.sample = sample;
  if (!sample) $("#btnWild").hidden = true;
  if (db) {
    let first = true; const tmr = setTimeout(() => { if (first) { first = false; buildQueue(); renderDeck(); } }, 8000);
    db.collection("swipes").onSnapshot((snap) => {
      for (const d of snap.docs) for (const [k, dir] of Object.entries((d.data() || {}).k || {})) { if (dir) S.swiped.set(k, { dir, day: d.id }); else S.swiped.delete(k); }
      if (first) { first = false; clearTimeout(tmr); buildQueue(); renderDeck(); }
    }, () => {});
    db.collection("ideas").onSnapshot((snap) => { S.ideas = new Map(snap.docs.map((d) => [d.id, d.data()])); badges(); if (!$("#view-ideas").hidden) renderIdeas(); }, () => {});
    db.collection("settings").onSnapshot((snap) => { for (const d of snap.docs) if (d.id === "voice") { const v = d.data() || {}; S.voice = v.name || null; S.vstyle = v.style || null; } }, () => {});
  }
  setFoot(mcp ? "Engine: connecting" : "Drive isn't available in this view.");
  await loadDeck(false);
  setInterval(() => { if (!document.hidden && Date.now() - S.statusAt > 55000 && (!$("#view-studio").hidden || jobs().some((j) => WORKING.has(j.stage)))) refreshStatus(false); }, 15000);
})();
</script>
</body>
</html>
