name: Topic scout
# Refills the idea deck every 4 hours, then publishes it to Drive. Also runs when the scout code changes.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/scout.py", "scripts/drive.py", ".github/workflows/scout.yml"]

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Find topics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          mkdir -p deck logs
          set -o pipefail
          python3 -u scripts/scout.py 2>&1 | tee logs/scout-last.log
      - name: Publish deck to Drive
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python3 -u scripts/drive.py deck 2>&1 | tee -a logs/scout-last.log
      - name: Save deck and log
        if: always()
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add deck/ logs/
          git diff --cached --quiet || git commit -m "Scout run ${{ job.status }}"
          git pull --rebase --autostash -q && git push
