name: Rick assets (Camp Century)
on:
  workflow_dispatch:
    inputs:
      steps: { description: "voice textures props", default: "voice textures props" }
permissions:
  contents: write
  id-token: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q faster-whisper
      - name: Generate
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/ice_assets.py ${{ github.event.inputs.steps }}
      - name: Save
        if: always()
        run: |
          git config user.name "engine"; git config user.email "engine@users.noreply.github.com"
          git add -f rick/stage2/public/ice ledger || true
          git commit -qm "Camp Century assets" || true
          git pull -q --rebase && git push -q || true
