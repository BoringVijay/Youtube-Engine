name: Camp Century render
# Renders the IceShort composition in parallel frame chunks (software GL), stitches them and adds the voice.
# Free: GitHub Actions minutes only, no API calls.
on:
  workflow_dispatch:
    inputs:
      chunks: { description: "parallel chunks", default: "20" }
      scale: { description: "1 = 1080x1920, 0.5 = 540x960", default: "1" }
      out: { description: "output name", default: "roughcut" }
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { ks: "${{ steps.p.outputs.ks }}" }
    steps:
      - id: p
        run: echo "ks=$(python3 -c "print(list(range(${{ inputs.chunks }})))")" >> "$GITHUB_OUTPUT"
  chunk:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy: { fail-fast: false, matrix: { k: "${{ fromJSON(needs.plan.outputs.ks) }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: rick/stage2/package-lock.json }
      - name: render chunk
        working-directory: rick/stage2
        run: |
          npm ci --no-audit --no-fund
          N=$(node -e "console.log(Math.round(72.6*30))"); C=${{ inputs.chunks }}; K=${{ matrix.k }}
          A=$(( N * K / C )); B=$(( N * (K + 1) / C - 1 ))
          npx remotion render src/index.tsx IceShort out/c$(printf %02d $K).mp4 --frames=$A-$B --scale=${{ inputs.scale }} \
            --gl=swangle --muted --concurrency=2 --crf=16 --timeout=300000 --log=error
      - uses: actions/upload-artifact@v4
        with: { name: "c${{ matrix.k }}", path: rick/stage2/out/*.mp4, retention-days: 3 }
  stitch:
    needs: chunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: parts, merge-multiple: true }
      - name: stitch + voice
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          ls parts/*.mp4 | sort | sed "s/^/file '/;s/$/'/" > list.txt
          ffmpeg -loglevel error -f concat -safe 0 -i list.txt -c copy video.mp4
          mkdir -p rick/projects/camp-century/renders
          ffmpeg -loglevel error -i video.mp4 -i rick/stage2/public/ice/voice.mp3 -c:v copy -c:a aac -b:a 192k -shortest \
            rick/projects/camp-century/renders/${{ inputs.out }}.mp4
          ls -la rick/projects/camp-century/renders
      - uses: actions/upload-artifact@v4
        with: { name: "${{ inputs.out }}", path: "rick/projects/camp-century/renders/${{ inputs.out }}.mp4" }
      - name: commit
        run: |
          git config user.name "engine-bot"; git config user.email "engine-bot@users.noreply.github.com"
          git add rick/projects/camp-century/renders && git commit -m "Camp Century render: ${{ inputs.out }}" && git pull --rebase && git push
