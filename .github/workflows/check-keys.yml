name: Check keys
# Run from the Actions tab > Check keys > Run workflow. Confirms Gemini, fal, YouTube and Google Cloud (Vertex) access work (nothing is generated or billed).
on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          code=$(curl -s -o models.json -w '%{http_code}' -H "x-goog-api-key: $GEMINI_API_KEY" \
            https://generativelanguage.googleapis.com/v1beta/models)
          echo "HTTP $code"
          if [ "$code" != "200" ]; then head -c 400 models.json; exit 1; fi
          echo "TTS models available:"; grep -o '"name": "models/[^"]*tts[^"]*"' models.json || echo "(none listed)"

      - name: fal key
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          if [ -z "$FAL_KEY" ]; then echo "FAL_KEY secret is missing. Create one at https://fal.ai/dashboard/keys"; exit 1; fi
          code=$(curl -s -o fal.json -w '%{http_code}' -H "Authorization: Key $FAL_KEY" \
            "https://api.fal.ai/v1/models/pricing?endpoint_id=fal-ai/nano-banana-pro")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then head -c 400 fal.json; exit 1; fi
          echo "Nano Banana Pro price:"; head -c 400 fal.json; echo

      - name: YouTube login
        env:
          CID: ${{ secrets.YT_CLIENT_ID }}
          CSECRET: ${{ secrets.YT_CLIENT_SECRET }}
          RTOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          at=$(curl -s https://oauth2.googleapis.com/token \
            -d client_id="$CID" -d client_secret="$CSECRET" -d refresh_token="$RTOKEN" -d grant_type=refresh_token \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "$at" ]; then echo "Could not get an access token. Re-check the 3 YT_ secrets."; exit 1; fi
          curl -s -H "Authorization: Bearer $at" \
            "https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&mine=true" \
            | python3 -c 'import sys,json; c=json.load(sys.stdin)["items"][0]; s=c["statistics"]; print("Channel:", c["snippet"]["title"], "| subs:", s.get("subscriberCount"), "| videos:", s["videoCount"], "| views:", s["viewCount"])'
      - name: Google Cloud key (free check, nothing billed)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "GCP_SA_KEY secret is missing."; exit 1; fi
          cd scripts && python3 - <<'PY'
          import json, os, gai
          sa = json.loads(os.environ["GCP_SA_KEY"])
          print("Project:", sa.get("project_id"), "| service account:", sa.get("client_email", "").split("@")[0])
          url = f"https://us-central1-aiplatform.googleapis.com/v1/projects/{gai.project()}/locations/us-central1/publishers/google/models/gemini-2.5-flash:countTokens"
          out = gai._req(url, {"contents": [{"role": "user", "parts": [{"text": "hello"}]}]},
                         {"Content-Type": "application/json", "Authorization": f"Bearer {gai._vertex_token()}"}, 30)
          print("Vertex AI reachable (countTokens is free):", out.get("totalTokens"), "tokens")
          PY
