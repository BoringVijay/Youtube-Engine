name: Rick Shots assets
# Generates the assets listed in rick/projects/<slug>/request.json (images on Google, music on Lyria, voice on fal).
# Never regenerates a file that exists; stops at the budget caps. See creative/rick/bible.md.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project slug (empty = every project)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["rick/projects/*/request.json"]

permissions:
  contents: write

concurrency:
  group: rick
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          RICK_PROJECT: ${{ github.event.inputs.project }}
        run: |
          pip install -q cryptography 2>/dev/null || true
          (which ffmpeg && which ffprobe) || { curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ -C /tmp && sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/; } || (sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y -qq --no-install-recommends ffmpeg)
          pip install -q numpy pillow scipy 2>/dev/null || true
          if grep -q '"type": "\(render\|words\)"' rick/projects/*/request.json; then
            pip install -q faster-whisper 2>/dev/null || true
            (cd rick/stage && npm install --silent --no-audit --no-fund && npx playwright install --with-deps chromium >/dev/null)
            sudo apt-get install -y -qq fonts-montserrat >/dev/null 2>&1 || true
          fi
          mkdir -p logs
          set -o pipefail
          python3 -u scripts/rick.py 2>&1 | tee logs/rick-last.log
      - name: Save results
        if: always()
        run: |
          git config user.name "engine-bot"
          git config user.email "engine-bot@users.noreply.github.com"
          git add -f logs/rick-last.log rick/projects ledger 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Rick assets"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
