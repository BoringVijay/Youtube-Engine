name: Produce videos
# Reads the Drive inbox, voices, plans and renders videos, and reports progress to Drive outbox/status.json.
# Runs every 2 hours (to save free minutes on a private repo), on demand, and when engine code changes.
# run: 1
on:
  schedule:
    - cron: "41 * * * *"
    # Instagram windows (IST 07:30, 19:30, 21:00), started a few minutes early; the step waits for the exact time
    - cron: "52 1 * * *"
    - cron: "52 13 * * *"
    - cron: "22 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "src/**", "config/*.json", "jobs/*/state.json", ".github/workflows/produce.yml"]

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - name: Use the latest job state (a queued run checks out an older commit)
        run: git pull -q --rebase origin main || true
      - name: Post scheduled Instagram Reels (light, on time)
        if: always()
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p logs
          python3 -u scripts/instagram.py 2>&1 | tee -a logs/produce-last.log || true
      - name: Quick inbox check (skip the heavy setup when there is nothing to do)
        id: check
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import glob, json, os, sys
          sys.path.insert(0, "scripts")
          import drive
          inbox = [f for f in drive.list_inbox() if f["name"].endswith(".json")]
          states = [json.load(open(p)) for p in glob.glob("jobs/*/state.json")]
          busy = [s for s in states if s.get("v") in (2, 3) and (s.get("stage") in ("queued","directing","voicing","art","test_render","motion","final_render","metadata","approved","uploading") or (s.get("instagram") or {}).get("status") in ("queued","posting","error"))]
          work = bool(inbox or busy) or os.environ.get("GITHUB_EVENT_NAME") != "schedule"
          print(f"inbox={len(inbox)} busy={len(busy)} work={work}")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"work={'yes' if work else 'no'}\n")
          EOF
      - uses: actions/setup-node@v4
        if: steps.check.outputs.work == 'yes'
        with:
          node-version: 20
          cache: npm
      - name: Cache the speech-timing model
        if: steps.check.outputs.work == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en-v1
      - name: Install
        if: steps.check.outputs.work == 'yes'
        run: |
          pip install -q faster-whisper cryptography
          npm ci --no-audit --no-fund
          (which ffmpeg && which ffprobe) || { curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ -C /tmp && sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/; } || (sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y -qq --no-install-recommends ffmpeg)
          ffmpeg -version | head -1
      - name: Produce
        if: steps.check.outputs.work == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PRODUCE_BUDGET_MIN: "55"
        run: |
          mkdir -p logs
          set -o pipefail
          python3 -u scripts/produce.py 2>&1 | tee logs/produce-last.log
      - name: Publish approved videos (private uploads only)
        if: steps.check.outputs.work == 'yes'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -o pipefail
          python3 -u scripts/publish.py 2>&1 | tee -a logs/produce-last.log
      - name: Post to Instagram (only Shorts you tapped Post on)
        if: steps.check.outputs.work == 'yes'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -o pipefail
          python3 -u scripts/instagram.py 2>&1 | tee -a logs/produce-last.log
      - name: Track posted Shorts on YouTube (light, every run)
        if: always()
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          mkdir -p logs
          python3 -u scripts/instagram.py insights-sync 2>&1 | tee -a logs/produce-last.log || true
          python3 -u scripts/youtube.py sync 2>&1 | tee -a logs/produce-last.log || true
      - name: Save job state
        if: always()
        run: |
          git config user.name "engine-bot"
          git config user.email "engine-bot@users.noreply.github.com"
          git add jobs logs ledger creative analytics || true
          git diff --cached --quiet || git commit -m "Produce run ${{ job.status }}"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
