name: Creative lab
# rerun: 3
# Tries visual styles, voices and AI motion. Runs when lab/request.json or the lab script changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lab/request.json", "scripts/lab.py", ".github/workflows/lab.yml"]

permissions:
  contents: write

concurrency:
  group: lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run lab
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          pip install -q cryptography 2>/dev/null || true
          (which ffmpeg && which ffprobe) || { curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ -C /tmp && sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/; } || (sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y -qq --no-install-recommends ffmpeg)
          ffmpeg -version | head -1
          mkdir -p logs lab/out
          set -o pipefail
          python3 -u scripts/lab.py 2>&1 | tee logs/lab-last.log
      - name: Save results
        if: always()
        run: |
          git config user.name "engine-bot"
          git config user.email "engine-bot@users.noreply.github.com"
          for f in logs/lab-last.log lab/out/*.jpg lab/out/*.mp3 lab/out/report.json lab/out/*-small.mp4; do [ -e "$f" ] && git add -f "$f"; done
          git diff --cached --quiet || git commit -m "Lab results"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
