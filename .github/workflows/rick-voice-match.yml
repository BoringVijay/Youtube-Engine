name: Rick voice match
on: workflow_dispatch
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q librosa
      - name: Match
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python3 scripts/voice_match.py
      - name: Save
        if: always()
        run: |
          git config user.name "engine"; git config user.email "engine@users.noreply.github.com"
          git add -f rick/voice-match ledger || true
          git commit -qm "Voice match results" || true
          git pull -q --rebase && git push -q || true
