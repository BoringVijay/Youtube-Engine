name: YouTube account check
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: whoami | kids | notkids
        default: whoami
jobs:
  whoami:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Which channel is the engine connected to?
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 scripts/youtube.py ${{ github.event.inputs.cmd || 'whoami' }}
